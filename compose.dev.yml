services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unkenprojekt_app
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - unkenprojekt_network

  nginx:
    image: nginx:alpine
    container_name: unkenprojekt_nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      # - "443:443"   # uncomment when you add TLS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/var/www/html:ro    # serve your static files directly
    depends_on:
      - app
    networks:
      - unkenprojekt_network
  
networks:
  unkenprojekt_network:
    driver: bridge