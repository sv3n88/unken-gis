<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unkenprojekt - Sonstige Arten</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <link rel="icon" type="image/png" href="../assets/bombina.png" />
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body>
    <div class="basemap-switcher">
      <div id="osm">
        <div class="icon" style="background-image: url('../assets/osm_icon.png')"></div>
      </div>
      <div id="google">
        <div class="icon" style="background-image: url('../assets/google_icon.png')"></div>
      </div>
    </div>
    <div id="map"></div>
    <div id="popup" class="ol-popup"></div>

    <!-- Photo modal -->
    <div id="photo-modal" class="photo-modal-overlay">
      <div class="photo-modal-viewport" id="photo-modal-viewport">
        <div id="photo-modal-box-inner"></div>
      </div>

      <!-- Gallery navigation arrows -->
      <button id="photo-gallery-prev" class="photo-gallery-nav photo-gallery-prev" title="Vorheriges Foto">&#8592;</button>
      <button id="photo-gallery-next" class="photo-gallery-nav photo-gallery-next" title="Nächstes Foto">&#8594;</button>
      <div id="photo-gallery-counter" class="photo-gallery-counter"></div>

      <button class="photo-modal-close" onclick="closePhotoModal()" title="Schließen">✕</button>
      <div class="photo-modal-zoom-controls">
        <button onclick="zoomPhoto(-1)"  title="Verkleinern">−</button>
        <button onclick="zoomPhoto(0)"   title="Zurücksetzen">⊙</button>
        <button onclick="zoomPhoto(1)"   title="Vergrößern">+</button>
        <button onclick="rotatePhoto()"  title="Drehen">↻</button>
      </div>
    </div>

    <script src="../js/modal.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/map.js"></script>
    <script src="../js/species_map.js"></script>
  </body>
</html>
