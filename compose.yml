services:
  postgis:
    image: kartoza/postgis:16-3.4
    container_name: unkenprojekt_postgis
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS="--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/initdb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - unkenprojekt_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unkenprojekt_app
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - unkenprojekt_network

  nginx:
    image: nginx:alpine
    container_name: unkenprojekt_nginx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      # - "443:443"   # uncomment when you add TLS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/var/www/html:ro    # serve your static files directly
    depends_on:
      - app
    networks:
      - unkenprojekt_network

networks:
  unkenprojekt_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
