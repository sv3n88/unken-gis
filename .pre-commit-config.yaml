# .pre-commit-config.yaml
#
# Install pre-commit:        pip install pre-commit
# Register the git hook:     pre-commit install
# Run manually on all files: pre-commit run --all-files

repos:

  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json


  # ── PHP: PHP-CS-Fixer ─────────────────────────────────────────────────
  # Runs in --dry-run mode — reports problems without rewriting.
  # To auto-fix locally: cd api && composer run lint:fix
  - repo: local
    hooks:
      - id: php-cs-fixer
        name: PHP-CS-Fixer
        language: system
        entry: bash -c 'cd app/api && vendor/bin/php-cs-fixer fix --dry-run --diff'
        types: [php]
        pass_filenames: false


  # ── JavaScript: ESLint ────────────────────────────────────────────────
  # Runs from the app/ directory where eslint.config.js lives.
  # To auto-fix locally: cd app && npm run lint:fix
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: system
        entry: bash -c 'cd app && npx eslint js/'
        types: [javascript]
        pass_filenames: false
